name: Collect and publish
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      article_url:
        description: 收藏公开资讯链接（留空则运行定时信源采集）
        type: string
        default: ''
      note:
        description: 收藏备注（公开保存，请勿填写私人信息）
        type: string
        default: ''
      test_new_sources:
        description: 优先验证新增信源
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: batch
          POSTGRES_DB: maker_batch
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:batch@127.0.0.1:5432/maker_batch
      SITE_URL: https://alias508508-sys.github.io/ai-maker-center
      COLLECT_ENABLED: 'true'
      MODEL_CALLS_ENABLED: 'true'
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-flash
      LLM_EXTRA_JSON: '{"thinking":{"type":"disabled"}}'
      JINA_BODY_FALLBACK: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node scripts/migrate.ts
      - run: node scripts/seed.ts
      - name: Collect and edit
        env:
          MAKER_ARTICLE_URL: ${{ inputs.article_url }}
          MAKER_NOTE: ${{ inputs.note }}
          MAKER_TEST_NEW_SOURCES: ${{ inputs.test_new_sources }}
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          test -n "$LLM_API_KEY" || { echo '缺少 DEEPSEEK_API_KEY'; exit 1; }
          node scripts/maker-auto.ts
          node scripts/maker-covers.ts
          node scripts/maker-archive.ts
          node scripts/maker-pages.ts
      - name: Save public results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-preview
          git diff --cached --quiet || git commit -m 'Update collected public news'
          git push origin HEAD:main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: pages-preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
