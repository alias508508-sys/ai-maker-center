limit_req_zone $binary_remote_addr zone=maker_login:10m rate=5r/m;
server {
  listen 80;
  server_name 47.236.76.200;
  location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
  location / { return 308 https://47.236.76.200$request_uri; }
}
server {
  listen 443 ssl;
  server_name 47.236.76.200;
  ssl_certificate /etc/letsencrypt/live/maker-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/maker-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 6m;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  location = /api/auth/password {
    limit_req zone=maker_login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/maker-proxy.conf;
  }
  location ~ ^/(admin(?:/|$|\.data)|api/(?:admin|auth)(?:/|$)) {
    include /etc/nginx/maker-proxy.conf;
  }
  location = /feed.xml {
    rewrite ^ /feed/all.xml break;
    include /etc/nginx/maker-proxy.conf;
  }
  location ^~ /feed/ { include /etc/nginx/maker-proxy.conf; }
  location ^~ /items/ { include /etc/nginx/maker-proxy.conf; }
  location = /all { include /etc/nginx/maker-proxy.conf; }
  location = /api/img-proxy { include /etc/nginx/maker-proxy.conf; }
  location = /favicon.ico { include /etc/nginx/maker-proxy.conf; }
  location = /og/site.png { include /etc/nginx/maker-proxy.conf; }
  location /assets/ { try_files $uri @web_assets; }
  location @web_assets { include /etc/nginx/maker-proxy.conf; }
  location / {
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml;
    try_files $uri $uri/ =404;
  }
}

