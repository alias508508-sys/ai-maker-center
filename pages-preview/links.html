<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>链接收藏 · AI maker.</title>
<style>body{margin:0;background:#eff1f3;color:#0a1526;font:16px/1.7 Arial,"PingFang SC",sans-serif}main{max-width:900px;margin:auto;padding:40px 24px}a{color:#2a5ae8}article{padding:24px 0;border-bottom:1px solid #d2d9e2}input{box-sizing:border-box;width:100%;padding:12px;font:inherit}p{color:#485b75}.button{display:inline-block;padding:12px 18px;background:#2a5ae8;color:white;text-decoration:none}</style>
<main><a href="index.html">← 返回创新中心</a><h1>链接收藏</h1><p>公开测试资料库：链接和备注会保存在公开 GitHub 仓库。请只提交公开资料，不要提交私人网址、访问令牌或个人信息。</p><a class="button" href="https://github.com/alias508508-sys/ai-maker-center/actions/workflows/collect.yml" target="_blank" rel="noopener">提交链接 ↗</a><p>登录 GitHub → Run workflow → 在 article_url 粘贴链接 → note 填备注 → 点击运行。请保持 main 分支。通常需要几分钟；未入选或抓取失败的链接仍会保存。当前版本会自动发布符合规则的资讯。</p><label for="search">搜索收藏</label><input id="search" type="search" placeholder="网址、备注、标题或分类"><p id="count"></p><div id="list"></div></main>
<script>const names={published:'已发布',saved:'已收藏，未发布',extracted:'已提取，处理中','link-only':'仅保存链接，正文暂不可读'};Promise.all([fetch('links.json').then(r=>r.json()),fetch('data.json').then(r=>r.json())]).then(([links,data])=>{const list=document.querySelector('#list');function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}function render(){list.replaceChildren();const q=document.querySelector('#search').value.toLowerCase();const rows=links.filter(l=>{const i=(l.item||data.items.find(i=>i.url===l.url));return JSON.stringify([l.url,l.note,i?.title,i?.category]).toLowerCase().includes(q)});document.querySelector('#count').textContent=rows.length+' 条收藏';for(const l of rows){const i=(l.item||data.items.find(i=>i.url===l.url));const a=node('article','');const link=node('a',i?.title||l.url);link.href=l.url;link.target='_blank';link.rel='noopener noreferrer';a.append(link,node('p',names[l.status]||l.status),node('p',l.note||''));if(i)a.append(node('p',i.summary),node('p','分类：'+(i.category||'未分类')));a.append(node('small',new Date(l.savedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+' 北京时间'));list.append(a)}}document.querySelector('#search').oninput=render;render()}).catch(()=>document.querySelector('#count').textContent='加载失败，请刷新重试');</script></html>
