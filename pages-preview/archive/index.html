<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史归档 · AI maker.</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eff1f3;color:#0a1526;font:16px/1.7 Arial,"PingFang SC",sans-serif}main{max-width:1040px;margin:auto;padding:40px 24px}a{color:#2a5ae8}h1{font-size:42px;letter-spacing:-.04em}section{border-top:1px solid #d2d9e2;padding:24px 0}button{padding:10px 18px;border:1px solid #2a5ae8;background:transparent;color:#2a5ae8;cursor:pointer}article{padding:24px 0;border-bottom:1px solid #d2d9e2}img{width:100%;max-width:480px;aspect-ratio:16/9;object-fit:cover}h2{font-size:24px}p{color:#485b75}</style>
<main><a href="../index.html">← 返回创新中心</a><h1>AI maker. 历史归档</h1><p>按北京时间归档每轮发布内容。首页保留最近 200 条，历史归档持续累积。初始快照保存启用归档时已有的资讯。</p><div id="batches"></div></main>
<script>const batches=[{"file":"2026-10-03/2026-10-03T13-42-08.686Z.json","date":"2026-10-03","collectedAt":"2026-10-03T13:42:08.686Z","count":0,"kind":"published-batch"},{"file":"2026-10-03/2026-10-03T10-12-53.983Z.json","date":"2026-10-03","collectedAt":"2026-10-03T10:12:53.983Z","count":17,"kind":"initial-snapshot"}];const root=document.querySelector('#batches');function node(tag,text){const e=document.createElement(tag);e.textContent=text;return e}for(const b of batches){const section=node('section','');section.append(node('h2',b.date+' · '+new Date(b.collectedAt).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' · '+b.count+' 条'+(b.kind==='initial-snapshot'?' · 初始快照':'')));const json=node('a','下载本轮 JSON');json.href=b.file;section.append(json,document.createTextNode('　'));const button=node('button','展开资讯');section.append(button);button.onclick=async()=>{button.disabled=true;try{const response=await fetch(b.file);if(!response.ok)throw new Error();const data=await response.json();for(const item of data.items){const article=node('article','');if(item.cover){const img=document.createElement('img');img.src='../'+item.cover;img.alt=item.title;img.loading='lazy';article.append(img)}article.append(node('h2',item.title),node('p',item.summary||''),node('p',item.sourceName||''));const link=node('a','阅读来源原文 ↗');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';article.append(link);section.append(article)}button.remove()}catch{button.textContent='加载失败，点击重试';button.disabled=false}};root.append(section)}</script></html>
